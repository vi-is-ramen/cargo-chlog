[package]
name = "cargo-chlog"
version = "0.1.0"
edition = "2024"
description = "A tool for generating changelogs from Git commits"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vi-is-ramen/cargo-chlog"
homepage = "https://github.com/vi-is-ramen/cargo-chlog"

[[bin]]
name = "cargo-chlog"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.4", features = ["serde"] }
annotate-snippets = { version = "0.12.16", features = ["testing-colors"] }
git2 = { version = "0.21.0", features = ["ssh", "vendored-openssl"] }
regex = "1.13.1"

[dev-dependencies]
annotate-snippets = { version = "0.12.16", features = ["testing-colors"] }
